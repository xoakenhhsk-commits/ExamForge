<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Brand Primary Gradient: Violet to Indigo to Mint -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Mint / Emerald Sparkle Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- AI Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Glowing Aura Backlight -->
  <circle cx="256" cy="240" r="140" fill="#8b5cf6" opacity="0.25" filter="url(#intenseGlow)" />
  <circle cx="310" cy="290" r="100" fill="#06b6d4" opacity="0.2" filter="url(#intenseGlow)" />

  <!-- Exam Document Sheet Shape -->
  <path d="M160 120 C160 102.3 174.3 88 192 88 H288 L352 152 V384 C352 401.7 337.7 416 320 416 H192 C174.3 416 160 401.7 160 384 Z" 
        fill="#ffffff" 
        fill-opacity="0.08" 
        stroke="url(#brandGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Folded Corner on Document -->
  <path d="M288 88 V140 C288 146.6 293.4 152 300 152 H352" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="10" 
        stroke-linecap="round"/>

  <!-- Modern Dynamic Lab Flask & Exam Lines Combination -->
  <!-- Document Lines -->
  <rect x="200" y="180" width="80" height="12" rx="6" fill="#a855f7" opacity="0.8"/>
  <rect x="200" y="212" width="112" height="12" rx="6" fill="#818cf8" opacity="0.7"/>

  <!-- Futuristic AI Lab Molecule / Pen Craft Glyph -->
  <g filter="url(#glow)">
    <!-- Lab Flask Outline -->
    <path d="M236 240 L236 266 L180 354 C172 366 181 384 196 384 H316 C331 384 340 366 332 354 L276 266 L276 240 Z" 
          fill="url(#brandGrad)" 
          fill-opacity="0.88" 
          stroke="#ffffff" 
          stroke-width="8" 
          stroke-linejoin="round"/>
    
    <!-- Lab Liquid Level Wave -->
    <path d="M198 348 Q228 332 256 348 T314 348 L322 360 C324 366 320 372 312 372 H200 C192 372 188 366 190 360 Z" 
          fill="url(#mintGrad)" />

    <!-- Bubbling AI Energy Dots inside flask -->
    <circle cx="236" cy="324" r="7" fill="#ffffff"/>
    <circle cx="270" cy="308" r="9" fill="#ffffff"/>
    <circle cx="282" cy="340" r="5" fill="#ffffff"/>
    <circle cx="248" cy="352" r="6" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Sparkling AI Star at Top Right -->
  <path d="M370 120 Q370 148 398 148 Q370 148 370 176 Q370 148 342 148 Q370 148 370 120 Z" 
        fill="#38bdf8" 
        filter="url(#glow)"/>
  
  <!-- Tiny Sparkle -->
  <circle cx="150" cy="200" r="6" fill="#34d399" filter="url(#glow)"/>
  <circle cx="360" cy="280" r="8" fill="#c084fc" filter="url(#glow)"/>
</svg>
